spring.application.name=TaskManagementTool

#MySQL Connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/taskmanagementtool
spring.datasource.username=root
spring.datasource.password=your_password
server.port=7676

#JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=yourmail10@gmail.com
spring.mail.password=mail_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Cloud
cloudinary.cloud-name=cloudinary_name
cloudinary.api_key=your_cloudinary_key
cloudinary.api-secret=your_cloudinary_secret



